
services:
  - type: web
    name: kalay-kitchen-luxury
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn Main:app
    plan: free
    disk:
      name: orders-disk
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /var/data/orders.db
      - key: EITAA_TOKEN
        sync: false
      - key: EITAA_CHAT_ID
        sync: false
      - key: ADMIN_PANEL_KEY
        sync: false
